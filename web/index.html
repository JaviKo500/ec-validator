<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive demo of ec_validations: validate Ecuadorian ID cards (cédula), RUC and phone numbers.">
  <meta name="theme-color" content="#2747A8">

  <!-- Link previews -->
  <meta property="og:title" content="ec_validations · Interactive demo">
  <meta property="og:description" content="Validate Ecuadorian ID cards (cédula), RUC and phone numbers in the browser.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EC Validator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ec_validations · Interactive demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #fbf8ff; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0d0e13; }
      #loading p { color: #c5c6d0; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms ease-out;
    }
    #loading .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #2747A8;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    #loading p { margin: 0; color: #44464f; font-size: 14px; }
    @keyframes pulse { 50% { transform: scale(0.9); opacity: 0.7; } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="logo">EC</div>
    <p>Loading ec_validations demo…</p>
  </div>
  <script>
    (function () {
      var lang = (navigator.language || 'en').slice(0, 2);
      var texts = {
        es: 'Cargando demo de ec_validations…',
        pt: 'Carregando demonstração do ec_validations…'
      };
      if (texts[lang]) {
        document.documentElement.lang = lang;
        document.querySelector('#loading p').textContent = texts[lang];
      }
    })();
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.style.opacity = '0';
      setTimeout(function () { loading.remove(); }, 200);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
